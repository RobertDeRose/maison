schema = 1

[defaults]
user = "operator"

[users.operator]
username = "operator"
full_name = "Maison Operator"
email = "operator@example.invalid"
github = "example-user"

[hosts.example-darwin]
system = "aarch64-darwin"
user = "operator"
profiles = ["base", "dev", "mac"]

[hosts.example-linux]
system = "aarch64-linux"
user = "operator"
profiles = ["base", "dev", "linux"]

[hosts.example-linux.deploy]
enable = true
hostname = "example-linux.example.invalid"
ssh_user = "maison-deploy"
user_ssh_user = "operator"
repo_path = "/home/operator/.maison"
remote_build = false
auto_rollback = true
magic_rollback = true
