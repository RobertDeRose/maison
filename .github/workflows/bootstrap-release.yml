name: Publish bootstrap release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Build verified bootstrap assets
        shell: bash
        run: |
          set -euo pipefail
          test -s bootstrap.sh
          sha256sum bootstrap.sh > SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  bootstrap\.sh$' SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Maison $GITHUB_REF_NAME" \
            --generate-notes \
            bootstrap.sh SHA256SUMS
