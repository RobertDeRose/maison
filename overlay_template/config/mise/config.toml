# Maison's public global mise baseline is kept here so this file works both as
# the overlay layer for the Maison project and as the installed user config.
[settings]
experimental = true
env_shell_expand = true
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]

[plugins]
nix = "https://github.com/jbadeau/mise-nix.git#e310c4c20e8273ba850298c10fbe97d0c858c300"

# Add private cross-platform tools and Homebrew formulae here.
[tools]
# python = "latest"

[bootstrap.packages]
# "brew:ripgrep" = "latest"

[env]
# EDITOR = "hx"

# The global mise file is installed from the overlay source. Maison temporarily
# hides the installed target while converging so these relative paths resolve
# from this checkout.
[dotfiles]
"~/.config/mise/config.toml" = { source = "../../config/mise/config.toml", mode = "symlink" }
"~/.config/mise/config.macos.toml" = { source = "../../config/mise/config.macos.toml", mode = "symlink" }
"~/.config/mise/config.macos-arm64.toml" = { source = "../../config/mise/config.macos-arm64.toml", mode = "symlink" }
"~/.config/mise/config.linux.toml" = { source = "../../config/mise/config.linux.toml", mode = "symlink" }
"~/.miserc.toml" = { source = "../../config/mise/.miserc.toml", mode = "symlink" }
# Add further mappings after adding the matching sources under dotfiles/.
# "~/.config/example/config.toml" = { source = "../../dotfiles/example/config.toml", mode = "symlink" }
