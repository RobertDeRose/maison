[tools]
codex = "latest"
mas = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@fission-ai/openspec" = "latest"
opencode = "latest"

[env]
SSH_AUTH_SOCK = "{{ env.HOME }}/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock"

# These settings are current-user preferences. Privileged and machine-wide
# settings remain in nix-darwin.
[bootstrap.macos.dock]
autohide = true
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"

[bootstrap.macos.keyboard]
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleKeyboardUIMode = 2, AppleShowAllExtensions = true, AppleShowAllFiles = true, NSAutomaticCapitalizationEnabled = false, NSDocumentSaveNewDocumentsToCloud = false, NSNavPanelExpandedStateForSaveMode = true, NSNavPanelExpandedStateForSaveMode2 = true, NSTextShowsControlCharacters = true, NSWindowShouldDragOnGesture = true, PMPrintingExpandedStateForPrint = true, PMPrintingExpandedStateForPrint2 = true, "com.apple.mouse.tapBehavior" = 1, "com.apple.sound.beep.feedback" = 0, "com.apple.swipescrolldirection" = false, WebKitDeveloperExtras = true }
"com.apple.AdLib" = { allowApplePersonalizedAdvertising = false }
"com.apple.AppleMultitouchTrackpad" = { Clicking = true, Dragging = true, TrackpadRightClick = true, TrackpadThreeFingerDrag = true }
"com.apple.ImageCapture" = { disableHotPlug = true }
"com.apple.controlcenter" = { BatteryShowPercentage = true }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.dock" = { "expose-group-apps" = true, "minimize-to-application" = true, showDesktopGestureEnabled = true, "wvous-bl-corner" = 4, "wvous-br-corner" = 6, "wvous-tl-corner" = 10, "wvous-tr-corner" = 14 }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { Clicking = true, Dragging = true, TrackpadRightClick = true, TrackpadThreeFingerDrag = true }
"com.apple.finder" = { _FXEnableColumnAutoSizing = true, _FXShowPosixPathInTitle = true, _FXSortFoldersFirst = true, _FXSortFoldersFirstOnDesktop = true, AppleShowAllFiles = false, FXDefaultSearchScope = "SCcf", FXRemoveOldTrashItems = true, NewWindowTarget = "PfHm", ShowMountedServersOnDesktop = true }
"com.apple.screencapture" = { "show-thumbnail" = true, target = "clipboard", type = "png" }

[bootstrap.hooks.post-defaults]
run = "killall Dock 2>/dev/null || true; killall Finder 2>/dev/null || true; killall SystemUIServer 2>/dev/null || true"
