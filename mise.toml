[settings]
experimental = true
env_shell_expand = true
dotfiles.default_mode = "symlink"
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]

# Repository tools are pinned in mise.lock. User tools, applications, and
# preferences live in config/mise and are separate from this project toolchain.
[tools]
# Bootstrap and Python-backed tasks use this project-owned runtime.
python = "3.13.14"
actionlint = "latest"
"aqua:Mic92/nixfmt-rs" = "latest"
aube = "latest"
biome = "latest"
cocogitto = "latest"
harper-cli = "latest"
hk = "1.49.0"
"github:rust-lang/mdBook" = "latest"
"npm:@contextlint/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:markdown-table-formatter" = "latest"
rumdl = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
ty = "latest"
typos = "latest"
uv = "latest"
usage = "4.0.0"

[env]
GIT_CONFIG_PARAMETERS = "'merge.ff=only'"
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"

[task_config]
includes = [".mise/tasks"]

[tasks.fix]
description = "Apply deterministic repository fixes"
quiet = true
run = "hk fix -a"

[tasks."docs:check"]
description = "Validate the documentation structure"
quiet = true
run = "uv run scripts/check-docs.py"

[tasks."docs:deployment:enable"]
description = "Enable GitHub Pages deployment"
quiet = true
run = "python3 scripts/enable-docs-deployment.py"

# Maison does not define user dotfiles here. A private overlay owns optional user configuration.
